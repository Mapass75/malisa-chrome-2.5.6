<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Malisa - AI web site Translator</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <header>
        <h1>Malisa</h1>
        <p id="subtitle" class="subtitle"></p>
      </header>
      <div id="themeToggle" class="theme-toggle" role="group" aria-label="Theme">
        <button type="button" class="theme-btn" data-theme="light" id="themeLight"></button>
        <button type="button" class="theme-btn" data-theme="dark" id="themeDark"></button>
        <button type="button" class="theme-btn" data-theme="system" id="themeSystem"></button>
      </div>
      <div class="field">
        <label id="labelLanguage" for="language"></label>
        <select id="language"></select>
      </div>
      <div class="field">
        <label id="labelProvider" for="provider"></label>
        <select id="provider"></select>
      </div>
      <div id="status" class="status hidden"></div>
      <div class="actions">
        <button id="translateBtn" class="btn primary"></button>
        <button id="restoreBtn" class="btn secondary"></button>
      </div>
      <section class="text-translate">
        <h2 id="textTranslateTitle" class="text-translate-title"></h2>
        <div class="lang-row">
          <select id="sourceLanguage" class="lang-select" aria-label="Source language"></select>
          <button id="swapLangBtn" class="icon-btn" type="button" title="Swap" aria-label="Swap languages">&#8646;</button>
          <select id="textTargetLanguage" class="lang-select" aria-label="Target language"></select>
          <button id="translateTextBtn" class="btn primary btn-compact"></button>
        </div>
        <div class="text-box">
          <textarea id="textInput" rows="3" maxlength="40000"></textarea>
          <div class="box-actions">
            <button id="listenInputBtn" class="icon-btn" type="button"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></button>
            <button id="stopInputBtn" class="icon-btn" type="button" hidden><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg></button>
          </div>
        </div>
        <div class="text-box">
          <div id="textOutput" class="text-output" aria-live="polite"></div>
          <div class="box-actions">
            <button id="copyTextBtn" class="btn secondary btn-compact" disabled></button>
            <button id="listenOutputBtn" class="icon-btn" type="button"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></button>
            <button id="stopOutputBtn" class="icon-btn" type="button" hidden><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg></button>
          </div>
        </div>
      </section>
      <footer>
        <a href="#" id="optionsLink"></a>
      </footer>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
